# https://prek.j178.dev/configuration/
default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/crate-ci/committed"
rev = "v1.1.7"
hooks = [{ id = "committed", stages = ["commit-msg"] }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.41.0"
hooks = [{ id = "typos" }]

# Format staged Go files using the standard Go formatter.
[[repos]]
repo = "local"
hooks = [
  { id = "gofmt", name = "gofmt", language = "system", entry = "gofmt -w", files = "\\.go$" },
]
