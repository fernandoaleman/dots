# tmux bar for Moonlight: the Mac Studio's catppuccin tmux plugin
# (Macchiato), copied from its running tmux as plain options (no plugin).
# Loaded by tmux.dots.conf while Moonlight is the active Omarchy theme,
# before resurrect/continuum; other themes keep Omarchy's bar
# (docs/decisions/desktop.md). Glyphs are Nerd Font icons.

set -g status-style "bg=#24273a,fg=#cad3f5"
set -g status-left-length 100
set -g status-right-length 100
set -g window-status-separator ""
set -g window-status-style "fg=#cad3f5,bg=#24273a,none"
set -g window-status-activity-style "fg=#cad3f5,bg=#24273a,none"

# Left: session (green, red while the prefix is held)
set -g status-left '#[fg=#{?client_prefix,#ed8796,#a6da95},bg=#24273a,nobold,nounderscore,noitalics] #[fg=#24273a,bg=#{?client_prefix,#ed8796,#a6da95},nobold,nounderscore,noitalics] #[fg=#cad3f5,bg=#363a4f] #S#[fg=#363a4f,bg=#24273a,nobold,nounderscore,noitalics] '
# Right: current folder (pink), clock (blue)
set -g status-right '#[fg=#f5bde6,bg=#24273a,nobold,nounderscore,noitalics] #[fg=#24273a,bg=#f5bde6,nobold,nounderscore,noitalics] #[fg=#cad3f5,bg=#363a4f] #{b:pane_current_path}#[fg=#363a4f,bg=#24273a,nobold,nounderscore,noitalics] #[fg=#8aadf4,bg=#24273a,nobold,nounderscore,noitalics] #[fg=#24273a,bg=#8aadf4,nobold,nounderscore,noitalics]󰃰 #[fg=#cad3f5,bg=#363a4f] %H:%M#[fg=#363a4f,bg=#24273a,nobold,nounderscore,noitalics] '
# Windows: the number (blue; the current window's peach), then the name
set -g window-status-format '#[fg=#8aadf4,bg=#24273a,nobold,nounderscore,noitalics]#[fg=#363a4f,bg=#8aadf4]#I#[fg=#8aadf4,bg=#363a4f,nobold,nounderscore,noitalics]█ #[fg=#cad3f5,bg=#363a4f]#W#[fg=#363a4f,bg=#24273a,nobold,nounderscore,noitalics] '
set -g window-status-current-format '#[fg=#f5a97f,bg=#24273a,nobold,nounderscore,noitalics]#[fg=#24273a,bg=#f5a97f]#I#[fg=#f5a97f,bg=#24273a,nobold,nounderscore,noitalics]█ #[fg=#cad3f5,bg=#24273a]#W#{?window_zoomed_flag,(),}#[fg=#24273a,bg=#24273a,nobold,nounderscore,noitalics] '

set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#8aadf4"
set -g message-style "fg=#91d7e3,bg=#363a4f,align=centre"
set -g message-command-style "fg=#91d7e3,bg=#363a4f,align=centre"
set -g mode-style "fg=#f5bde6,bg=#5b6078,bold"
setw -g clock-mode-colour "#8aadf4"
