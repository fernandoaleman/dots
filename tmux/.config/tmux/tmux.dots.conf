# Loaded by the last line of Omarchy's ~/.config/tmux/tmux.conf (added by dots'
# install.sh), after Omarchy's settings, so anything here overrides them.

# Prefix stays Omarchy's Ctrl+Space. Drop the second prefix (Ctrl+b) so
# Ctrl+b reaches nvim (page up, blink docs scroll) and the shell.
set -g prefix2 None

# Undercurls and colored underlines (e.g. nvim spelling errors) instead of
# plain underlines; Omarchy enables RGB but not this
set -as terminal-features ',*:usstyle'

# Ctrl+h/j/k/l move between tmux panes AND nvim splits (vim-tmux-navigator;
# the nvim half is lua/plugins/vim-tmux-navigator.dots.lua). In vim/nvim or
# fzf panes the keys pass through; elsewhere tmux moves panes. Snippet from
# the plugin's README (no TPM needed). Omarchy's Ctrl+Alt+Arrow still work.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -N "Focus pane left (nvim-aware)" -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -N "Focus pane down (nvim-aware)" -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -N "Focus pane up (nvim-aware)" -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -N "Focus pane right (nvim-aware)" -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -N "Focus previous pane (nvim-aware)" -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Type into every pane of the window at once (used with tmux-ssh)
bind -N "Toggle synchronize panes" = set-window-option synchronize-panes

# Session picker (replaces sesh): running sessions + zoxide directories in a
# popup; picking a directory creates/switches to its session. Overrides
# Omarchy's prefix k (kill window, no confirmation); prefix & still kills a
# window, after asking.
bind -N "Pick or create a session" k display-popup -E -w 60% -h 60% "~/.config/tmux/session-picker"

# Session persistence (cloned at pinned commits by install.sh, no TPM):
# resurrect saves/restores sessions (prefix Ctrl+s / prefix Ctrl+r),
# continuum auto-saves every 15 minutes.
# Keep these LAST, after anything that sets status-right: continuum hooks its
# auto-save into status-right when it loads, and anything that later replaces
# status-right silently stops auto-saving (see troubleshooting).
run-shell -b ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell -b ~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux

# Machine-local overrides, not stored in dots (skipped if missing)
source-file -q ~/.config/tmux/tmux.local.conf
