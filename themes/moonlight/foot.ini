# Shipping foot.ini replaces the one Omarchy renders from
# default/themed/foot.ini.tpl: Ghostty's "Catppuccin Mocha" exactly (its
# black, white and cursor differ from what the template derives), and the
# Mac Studio's Ghostty background-opacity = 0.9 (background only; text
# stays solid).
[colors-dark]
foreground=cdd6f4
background=1e1e2e
selection-foreground=cdd6f4
selection-background=585b70
alpha=0.9
# Also cells painted in this exact color: Omarchy sets tmux's pane background
# to the theme color (omarchy-theme-set-tmux), which foot's default mode keeps
# solid, leaving only the padding see-through.
alpha-mode=matching

cursor=1e1e2e f5e0dc

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=a6adc8

bright0=585b70
bright1=f37799
bright2=89d88b
bright3=ebd391
bright4=74a8fc
bright5=f2aede
bright6=6bd7ca
bright7=bac2de
