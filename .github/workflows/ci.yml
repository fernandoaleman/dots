name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            Makefile
            staticcheck.conf
      - name: Verify runner OS, architecture, and Go
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          case "$RUNNER_LABEL:$(uname -s):$(uname -m)" in
            xcode-27:Darwin:arm64)
              version="$(sw_vers -productVersion)"
              case "$version" in 27|27.*) ;; *) echo "expected macOS 27, got $version" >&2; exit 1 ;; esac
              test "$(go env GOOS)/$(go env GOARCH)" = darwin/arm64 ;;
            ubuntu-24.04:Linux:x86_64)
              . /etc/os-release
              test "$ID" = ubuntu
              test "$VERSION_ID" = 24.04
              test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64 ;;
            *) echo "unexpected runner OS or architecture" >&2; exit 1 ;;
          esac
          go version
          case "$(go env GOVERSION)" in go1.23.*) ;; *) echo "expected Go 1.23" >&2; exit 1 ;; esac
      - name: Install pinned Staticcheck
        run: make install-staticcheck
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: staticcheck ./...
      - run: go build ./...
      - name: Run prek checks
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # prek-action v3.0.1
        with:
          prek-version: '0.4.4'
          extra-args: --all-files
          cache: true

  acceptance:
    name: Acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify runner OS, architecture, and Go
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          case "$RUNNER_LABEL:$(uname -s):$(uname -m)" in
            xcode-27:Darwin:arm64)
              version="$(sw_vers -productVersion)"
              case "$version" in 27|27.*) ;; *) echo "expected macOS 27, got $version" >&2; exit 1 ;; esac
              test "$(go env GOOS)/$(go env GOARCH)" = darwin/arm64 ;;
            ubuntu-24.04:Linux:x86_64)
              . /etc/os-release
              test "$ID" = ubuntu
              test "$VERSION_ID" = 24.04
              test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64 ;;
            *) echo "unexpected runner OS or architecture" >&2; exit 1 ;;
          esac
          go version
          case "$(go env GOVERSION)" in go1.23.*) ;; *) echo "expected Go 1.23" >&2; exit 1 ;; esac
      - name: Installed CLI acceptance
        run: python3 scripts/acceptance.py
      - name: Native recovery and capability coverage (explicit skips)
        run: >-
          go test -count=1 -v -timeout=5m ./internal/filesystem
          -run '^(TestImportCLI|TestRecoveryCLI|TestInspectImportLinuxBindConfiguration|TestImportSelectedInputMountView)$'


  packaging:
    name: Packaging (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, target: darwin/amd64}
          - {os: xcode-27, target: darwin/arm64}
          - {os: ubuntu-24.04, target: linux/amd64}
          - {os: ubuntu-24.04-arm, target: linux/arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read packaging compiler pin
        id: compiler
        shell: bash
        run: echo "version=$(python3 scripts/package.py compiler)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.compiler.outputs.version }}
      - name: Verify native target and provision modules
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          case "$NATIVE_TARGET:$(uname -s):$(uname -m)" in
            darwin/amd64:Darwin:x86_64) sw_vers -productVersion ;;
            darwin/arm64:Darwin:arm64)
              version="$(sw_vers -productVersion)"
              case "$version" in 27|27.*) ;; *) echo "expected macOS 27, got $version" >&2; exit 1 ;; esac ;;
            linux/amd64:Linux:x86_64|linux/arm64:Linux:aarch64)
              . /etc/os-release
              test "$ID" = ubuntu
              test "$VERSION_ID" = 24.04 ;;
            *) echo "unexpected runner OS or architecture" >&2; exit 1 ;;
          esac
          test "$(go env GOOS)/$(go env GOARCH)" = "$NATIVE_TARGET"
          go version
          test "$(go env GOVERSION)" = "go$(python3 scripts/package.py compiler)"
          go mod download
      - run: make test-package
      - name: Build and compare complete candidate sets
        shell: bash
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          make package VERSION=v0.1.0 COMMIT="$GITHUB_SHA" DIST=dist/first
          make package VERSION=v0.1.0 COMMIT="$GITHUB_SHA" DIST=dist/repeat
          cmp dist/first/SHA256SUMS dist/repeat/SHA256SUMS
      - name: Verify checksums and extract native candidate
        run: >-
          python3 scripts/package.py verify --version v0.1.0 --directory dist/first
          --extract-target '${{ matrix.target }}' --extract-to build/extracted
      - name: Execute verified installed artifact (no rebuild)
        run: >-
          python3 scripts/acceptance.py --binary build/extracted/dots
          --expected-version v0.1.0 --license build/extracted/LICENSE
