name: Nonpublishing release validation

on:
  push:
    branches: [test/m5-release-validation]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check authoritative artifact download contract
        run: python3 -B -m unittest discover -s scripts -p 'test_artifact_layout.py'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: e506de8d3bddc38313bbe4cc3425a4637a35c714
          persist-credentials: false
      - name: Run mocked release policy and gate tests
        run: python3 -B -m unittest discover -s scripts -p 'test_release*.py'

  package:
    needs: policy
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sums_sha256: ${{ steps.digest.outputs.sums_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: e506de8d3bddc38313bbe4cc3425a4637a35c714
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact packaging input commit
        run: test "$(git rev-parse HEAD)" = e506de8d3bddc38313bbe4cc3425a4637a35c714 && test -z "$(git status --porcelain)"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10'
      - run: go mod download
      - name: Build authoritative artifacts
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: python3 scripts/package.py build --version v0.1.0 --commit e506de8d3bddc38313bbe4cc3425a4637a35c714 --output dist/release
      - name: Verify artifact set and record identity
        id: digest
        run: |
          python3 scripts/package.py verify --version v0.1.0 --directory dist/release
          echo "sums_sha256=$(sha256sum dist/release/SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: validation-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  native:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, target: darwin/amd64}
          - {os: macos-15, target: darwin/arm64}
          - {os: ubuntu-24.04, target: linux/amd64}
          - {os: ubuntu-24.04-arm, target: linux/arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: e506de8d3bddc38313bbe4cc3425a4637a35c714
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10'
      - name: Validate authoritative artifact ID
        env:
          ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
        run: |
          case "$ARTIFACT_ID" in
            ""|0*|*[!0-9]*) echo "invalid authoritative artifact ID" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: dist/release
          merge-multiple: true
      - name: Verify and extract the authoritative native artifact
        env:
          EXPECTED_SUMS: ${{ needs.package.outputs.sums_sha256 }}
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          case "$NATIVE_TARGET:$(uname -s):$(uname -m)" in
            darwin/amd64:Darwin:x86_64|darwin/arm64:Darwin:arm64|linux/amd64:Linux:x86_64|linux/arm64:Linux:aarch64) ;;
            *) echo "unexpected native operating system or architecture" >&2; exit 1 ;;
          esac
          test "$(go env GOOS)/$(go env GOARCH)" = "$NATIVE_TARGET"
          test "$(shasum -a 256 dist/release/SHA256SUMS | cut -d ' ' -f 1)" = "$EXPECTED_SUMS"
          python3 scripts/package.py verify --version v0.1.0 --directory dist/release --extract-target "$NATIVE_TARGET" --extract-to build/extracted
      - name: Execute the extracted artifact without rebuilding
        run: |
          go version -m build/extracted/dots | grep -F 'vcs.revision=e506de8d3bddc38313bbe4cc3425a4637a35c714'
          python3 scripts/acceptance.py --binary build/extracted/dots --expected-version v0.1.0 --license build/extracted/LICENSE
